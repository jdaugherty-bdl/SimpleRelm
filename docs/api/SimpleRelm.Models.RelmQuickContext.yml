  summary: Performs a bulk write operation to insert or update data in the specified database table.
  remarks: >-
    This method is optimized for high-performance bulk operations and supports optional
        batching to handle large datasets efficiently.  Ensure that the source data aligns with the schema of the
        target table to avoid runtime errors.
  example: []
  syntax:
    content: public int BulkTableWrite<T>(T SourceData, string TableName = null, MySqlTransaction sqlTransaction = null, Type ForceType = null, int BatchSize = 100, bool allowAutoIncrementColumns = false, bool allowPrimaryKeyColumns = false, bool allowUniqueColumns = false)
