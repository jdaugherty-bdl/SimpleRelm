      description: >-
        An optional <xref href="MySql.Data.MySqlClient.MySqlTransaction" data-throw-if-not-resolved="false"></xref> to associate the bulk write operation with an existing
            transaction. If null, the operation will execute without a transaction.
    - id: ForceType
      type: System.Type
    - id: BatchSize
      type: System.Int32
    - id: allowAutoIncrementColumns
      type: System.Boolean
      description: >-
        Indicates whether auto-increment columns in the target table are allowed to be explicitly written. Defaults
            to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    - id: allowPrimaryKeyColumns
      type: System.Boolean
      description: >-
        Indicates whether primary key columns in the target table are allowed to be explicitly written. Defaults to
            <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    - id: allowUniqueColumns
      type: System.Boolean
      description: Indicates whether unique columns in the target table are allowed to be explicitly written. Defaults to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    typeParameters:
    - id: T
      description: >-
        The type of the source data. This can be a collection or a single object representing the data to be
            written.
    return:
      type: System.Int32
      description: The number of rows successfully written to the database table.
